name: Build GLITCH OS ISO (Arch live)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iso/**"
      - "config/files/**"
      - ".github/workflows/iso.yml"

jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install archiso
        run: pacman -Syu --noconfirm archiso

      - name: Build ISO
        run: bash iso/build-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: glitch-os-live-iso
          path: iso/out/*.iso
          if-no-files-found: error
          retention-days: 14

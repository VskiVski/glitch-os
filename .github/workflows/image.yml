name: Build GLITCH OS Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: glitch-os

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck (GLITCH Engine + build)
        run: shellcheck -x -S error config/files/usr/bin/glitch-* build.sh

  build:
    needs: lint
    strategy:
      matrix:
        variant: [main, nvidia]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (${{ matrix.variant }})
        run: |
          case "${{ matrix.variant }}" in
            main)   BASE=ghcr.io/ublue-os/kinoite-main:latest ;;
            nvidia) BASE=ghcr.io/ublue-os/kinoite-nvidia:latest ;;
          esac
          TAG_NAME="${{ env.IMAGE_NAME }}"
          [ "${{ matrix.variant }}" = "nvidia" ] && TAG_NAME="${TAG_NAME}-nvidia"
          VERSION="${GITHUB_REF_NAME//\//-}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PUSH_FLAG=""
          [ "${{ github.event_name }}" != "pull_request" ] && PUSH_FLAG="--push"
          # buildx docker-container + --push: layers vao direto para o registry,
          # sem registo no overlay2 do daemon (limite ~127 layers das bases uBlue)
          docker buildx build \
            -f Containerfile \
            --build-arg BASE_IMAGE="$BASE" \
            -t "ghcr.io/${OWNER}/${TAG_NAME}:${VERSION}" \
            -t "ghcr.io/${OWNER}/${TAG_NAME}:latest" \
            $PUSH_FLAG \
            .

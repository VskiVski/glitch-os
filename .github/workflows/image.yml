name: Build GLITCH OS Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: glitch-os

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck (GLITCH Engine + build)
        run: shellcheck -x -S error config/files/usr/bin/glitch-* build.sh

  build:
    needs: lint
    strategy:
      matrix:
        variant: [main, nvidia]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image (${{ matrix.variant }})
        run: |
          case "${{ matrix.variant }}" in
            main)   BASE=ghcr.io/ublue-os/kinoite-main:stable ;;
            nvidia) BASE=ghcr.io/ublue-os/kinoite-nvidia:stable ;;
          esac
          TAG_NAME="${{ env.IMAGE_NAME }}"
          [ "${{ matrix.variant }}" = "nvidia" ] && TAG_NAME="${TAG_NAME}-nvidia"
          VERSION="${GITHUB_REF_NAME//\//-}"
          docker build \
            --build-arg BASE_IMAGE="$BASE" \
            -t "ghcr.io/${{ github.repository_owner }}/${TAG_NAME}:${VERSION}" \
            -t "ghcr.io/${{ github.repository_owner }}/${TAG_NAME}:latest" \
            .
          echo "IMAGE_FULL=ghcr.io/${{ github.repository_owner }}/${TAG_NAME}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "$IMAGE_FULL"
